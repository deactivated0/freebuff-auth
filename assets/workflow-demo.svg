<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Freebuff Auth quick start screenshot</title><desc id="desc">Illustrative terminal commands for adding and switching accounts</desc><rect width="1200" height="520" rx="24" fill="#080d16"/><rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#273449" stroke-width="2"/><path d="M1 61h1198" stroke="#273449" stroke-width="2"/><circle cx="32" cy="31" r="8" fill="#fb7185"/><circle cx="58" cy="31" r="8" fill="#fbbf24"/><circle cx="84" cy="31" r="8" fill="#34d399"/><text x="600" y="38" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="17">freebuff-auth — quick start</text><text x="70" y="125" fill="#67e8f9" font-family="monospace" font-size="19"># add another login in its own profile</text><text x="70" y="173" fill="#f8fafc" font-family="monospace" font-size="23">$ freebuff-auth login --alias work</text><text x="70" y="211" fill="#94a3b8" font-family="monospace" font-size="18">Official Freebuff CLI opens browser login.</text><text x="70" y="278" fill="#67e8f9" font-family="monospace" font-size="19"># pick account, then launch Freebuff</text><text x="70" y="326" fill="#f8fafc" font-family="monospace" font-size="23">$ freebuff-auth switch work --run</text><text x="70" y="388" fill="#34d399" font-family="monospace" font-size="18">✓ Selected profile: work</text><text x="70" y="425" fill="#34d399" font-family="monospace" font-size="18">✓ Launching official Freebuff CLI</text><text x="70" y="482" fill="#64748b" font-family="monospace" font-size="15">Illustrative preview · no real account data</text></svg>
