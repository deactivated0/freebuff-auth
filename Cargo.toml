[package]
name = "freebuff-auth"
version = "0.2.0"
edition = "2021"
description = "Rust-only Freebuff account manager and terminal switcher"
license = "MIT"
rust-version = "1.74"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"

[[bin]]
name = "freebuff-auth"
path = "src/bin/freebuff-auth.rs"

[[bin]]
name = "freebuff-switch"
path = "src/bin/freebuff-switch.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
